name: Update OpenCode model prices

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC so price changes arrive as a reviewed PR.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-opencode-prices
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Refresh OpenCode prices from models.dev
        run: bun run update:opencode-prices

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/core/usage/opencode-prices.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck and test
        if: steps.diff.outputs.changed == 'true'
        run: bun run check

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-opencode-prices"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/core/usage/opencode-prices.generated.json
          git commit -m "core: refresh OpenCode model prices from models.dev"
          git push --force-with-lease origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^1$'; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "core: refresh OpenCode model prices from models.dev" \
              --body "Automated refresh of \`src/core/usage/opencode-prices.generated.json\` from \`https://models.dev/api.json\`. Review the diff to verify any upstream price changes before merging."
          fi
