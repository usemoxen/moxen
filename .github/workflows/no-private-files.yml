# Local copy of the "no private files" guard. The source of truth is
# usemoxen/home (.github/workflows/no-private-files.yml, private). A public repo
# cannot call a workflow in a private repo, so this is a copy: when home changes,
# update this file to match. Deny list: private design-system docs, component
# READMEs, mockups and .private/ folders (MXN-355, MXN-356).
name: No private files

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      deny:
        description: Newline-separated glob patterns a public repo must not track.
        type: string
        default: |
          **/design-system/docs/**
          **/design-system/components/*/README.md
          **/mockups/**
          **/.private/**

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on tracked private paths
        env:
          DENY: ${{ inputs.deny }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          def rx(glob):
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i): out += "(?:.*/)?"; i += 3
                  elif glob.startswith("**", i): out += ".*"; i += 2
                  elif glob[i] == "*": out += "[^/]*"; i += 1
                  elif glob[i] == "?": out += "[^/]"; i += 1
                  else: out += re.escape(glob[i]); i += 1
              return re.compile("^" + out + "$")
          # On push and pull_request there is no input, so fall back to the defaults.
          DEFAULT = "**/design-system/docs/**\n**/design-system/components/*/README.md\n**/mockups/**\n**/.private/**"
          deny = os.environ.get("DENY", "").strip() or DEFAULT
          rules = [(g.strip(), rx(g.strip())) for g in deny.splitlines() if g.strip()]
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          bad = [(p, g) for p in paths if p for g, r in rules if r.match(p)]
          for p, g in bad:
              print(f"::error file={p}::private path tracked (matches {g})")
          sys.exit(1 if bad else 0)
          PY
