name: CI

on:
  # One run per commit: a PR branch would otherwise run twice (once for the
  # push, once for the pull_request). Merges to main still run, as does any
  # direct push to main; a branch with no PR yet gets its run when the PR opens.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the same commands run everywhere.
        shell: bash
    steps:
      # Windows would otherwise check files out with CRLF endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run check

      - name: Build
        run: bun run build

      - name: Local semantic memory search (production bundle)
        run: bun scripts/verify-memory-embeddings.ts

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the same commands run everywhere.
        shell: bash
        working-directory: src/desktop
    steps:
      # Windows would otherwise check files out with CRLF endings. Runs
      # before checkout, when src/desktop doesn't exist yet.
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop

      # The build embeds only tracked files (fonts, icons, tokens.json and
      # the logo in design-system/). The sync script that refreshes them
      # needs the private design-system repo and never runs here.
      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  finances:
    name: finances (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the same commands run everywhere.
        shell: bash
        working-directory: src/finances
    steps:
      # Windows would otherwise check files out with CRLF endings. Runs
      # before checkout, when src/finances doesn't exist yet.
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The workspace pins its exact Rust version in rust-toolchain.toml;
      # rustup honors it, and this step keeps the same setup as the
      # desktop job (rustup, rustfmt and clippy components available).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/finances

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
