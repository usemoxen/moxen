name: CI

on:
  # One run per commit: a PR branch would otherwise run twice (once for the
  # push, once for the pull_request). Merges to main still run, as does any
  # direct push to main; a branch with no PR yet gets its run when the PR opens.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the same commands run everywhere.
        shell: bash
    steps:
      # Windows would otherwise check files out with CRLF endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run check

      - name: Build
        run: bun run build

      - name: Local semantic memory search (production bundle)
        run: bun scripts/verify-memory-embeddings.ts
