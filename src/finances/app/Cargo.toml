[package]
name = "moxen-finances"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "moxen-finances"
path = "src/main.rs"

[features]
# Drives a hidden window from a script and renders offscreen frames to PNG,
# the same approach as the desktop's `render-harness`.
render-harness = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "moxen-finances-ui/render-harness",
]

[dependencies]
moxen-finances-ui = { path = "../ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
