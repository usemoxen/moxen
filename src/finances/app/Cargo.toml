[package]
name = "moxen-finances"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "moxen-finances"
path = "src/main.rs"

[features]
# Drives a hidden window from a script and renders offscreen frames to PNG,
# the same approach as the desktop's `render-harness`.
render-harness = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "moxen-finances-ui/render-harness",
]

[dependencies]
moxen-finances-ui = { path = "../ui" }
# LOCAL-030: the app wires the store (and the core it is built on) behind the
# ui crate's FinancesData/FinancesMutations traits, as its StoreData adapter.
# The ui crate itself never links SQLite.
moxen-finances-store = { path = "../store" }
moxen-finances-core = { path = "../core" }
# LOCAL-031: the Enable Banking client, linked here and never in the ui crate.
moxen-finances-banking = { path = "../banking" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Temporary directories for every test: no test may touch a real data path.
tempfile = "3"
# GPUI's test support for the render tests that drive a real window over a
# real StoreData on a temp SQLite database. Dev-only: a normal build never
# links it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", features = ["test-support"] }
