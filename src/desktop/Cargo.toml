[package]
name = "moxen-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
render-harness = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
base64 = "0.22"
unicode-segmentation = "1"
serde_json = "1"
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", features = ["font-kit"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
