[package]
name = "moxen-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
render-harness = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
unicode-segmentation = "1"
serde_json = "1"
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", features = ["font-kit"] }
